name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Testy a kontrola formátu
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, zip, gd, exif, pdo_sqlite, bcmath
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Composer install
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: NPM install a build
        run: |
          npm ci
          npm run build

      - name: Příprava prostředí
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Kontrola formátu (Pint)
        run: vendor/bin/pint --test

      - name: Testy
        run: php artisan test
