name: CI

# Testy běží hned po odeslání práce agenta (větve agent/…), ne až po kliknutí
# na Zveřejnit. Než člověk projde snímky, jsou hotové a sloučení nečeká.
# Na pull requestu se testuje výsledek sloučení s main. Nasazení podruhé
# netestuje, jen si ověří, že pull request prošel (deploy.yml).
on:
  push:
    branches: [main, 'agent/**']
  pull_request:

# Agent pošle větev znovu: rozběhnuté testy starší verze nemají cenu.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Testy a kontrola formátu
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, zip, gd, exif, pdo_sqlite, bcmath
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # Hotová složka vendor podle composer.lock: instalace pak jen ověří, že sedí.
      - name: Cache vendor
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-dev-${{ hashFiles('composer.lock') }}

      - name: Composer install
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: NPM install a build
        run: |
          [ "${{ steps.node-modules.outputs.cache-hit }}" = true ] || npm ci
          npm run build

      - name: Příprava prostředí
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Kontrola formátu (Pint)
        run: vendor/bin/pint --test

      - name: Testy
        run: php artisan test
