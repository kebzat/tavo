name: Deploy

# Nasadí se hned po sloučení do main, jen otestovaný kód.
#
# Testy už proběhly v pull requestu (CI testuje výsledek sloučení s main),
# podruhé se na ně nečeká: tlačítko Zveřejnit v nástrojích je tak na webu
# do pár minut. Krok „Prošly testy?“ to ověří: commit musí patřit ke
# sloučenému pull requestu, jehož poslední commit prošel testy. Jinak
# (přímý push do main, sloučení před doběhnutím testů) se testy pustí tady
# a bez nich se nenasadí.
#
# Projekt se sestaví tady na GitHubu (composer + vite) a na server se přes rsync
# pošle hotový výsledek. Server tedy nepotřebuje git, composer ani node — stačí
# SSH, rsync a PHP.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Nasazení na produkci
    runs-on: ubuntu-latest
    environment: production

    env:
      SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
      # Alias z ~/.ssh/config níž. Všechny kroky jedou přes jedno sdílené spojení.
      REMOTE: produkce

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, zip, gd, exif, pdo_mysql, pdo_sqlite, bcmath
          coverage: none

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Název kontroly = název jobu v ci.yml („Testy a kontrola formátu“).
      - name: Prošly testy v pull requestu?
        id: testy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hlava=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null)][0].head.sha // empty' || true)
          zelene=0
          if [ -n "$hlava" ]; then
            zelene=$(gh api -X GET "repos/$GITHUB_REPOSITORY/commits/$hlava/check-runs" \
              -f check_name='Testy a kontrola formátu' \
              --jq '[.check_runs[] | select(.conclusion == "success")] | length' || echo 0)
          fi
          if [ "${zelene:-0}" -gt 0 ]; then
            echo "Pull request prošel testy ($hlava), znovu se netestuje."
            echo "proslo=1" >> "$GITHUB_OUTPUT"
          else
            echo "K commitu není pull request se zelenými testy, testuje se tady."
          fi

      # Jen načíst: na konci je ve vendor verze bez dev balíčků, ta se pod
      # klíčem CI ukládat nesmí.
      - name: Cache vendor (testy)
        if: steps.testy.outputs.proslo != '1'
        uses: actions/cache/restore@v4
        with:
          path: vendor
          key: vendor-dev-${{ hashFiles('composer.lock') }}

      - name: Testy (jen bez zeleného pull requestu)
        if: steps.testy.outputs.proslo != '1'
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci
          npm run build
          cp .env.example .env
          php artisan key:generate
          vendor/bin/pint --test
          php artisan test
          rm .env

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-deploy-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Composer install (bez dev balíčků)
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress --prefer-dist


      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Sestavit assety
        run: |
          [ -d node_modules/.bin ] || npm ci
          npm run build

      # Server občas utne nové SSH spojení hned při navázání („Connection reset
      # by peer"), když jich z jedné adresy přijde víc rychle za sebou. Proto
      # jedno sdílené spojení (ControlMaster) pro všechny kroky, klíč serveru
      # jedním dotazem a opakované navázání s pauzou.
      - name: Připravit SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<EOF
          Host produkce
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/deploy_key
            ControlMaster auto
            ControlPath ~/.ssh/cm-%C
            ControlPersist 15m
            ConnectTimeout 20
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config

          for i in 1 2 3 4 5; do
            # Nejdřív jen ed25519 (jedno spojení), kdyby ho server neměl, ostatní typy.
            # `|| true`: krok běží s `bash -e`, takže neúspěšný keyscan by skript
            # ukončil hned při prvním pokusu a opakování by se nikdy nespustilo.
            ssh-keyscan -t ed25519 -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            [ -s ~/.ssh/known_hosts ] || ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            [ -s ~/.ssh/known_hosts ] && break
            echo "Klíč serveru se nenačetl, pokus $i."; sleep $((i * 5))
          done
          [ -s ~/.ssh/known_hosts ] || { echo "Klíč serveru se nepodařilo načíst."; exit 1; }

      - name: Navázat spojení se serverem
        run: |
          sleep 3
          for i in 1 2 3 4 5 6; do
            if ssh -fN "$REMOTE" && ssh -O check "$REMOTE" 2>/dev/null; then
              echo "Spojení navázané (pokus $i)."; exit 0
            fi
            echo "Server spojení odmítl, pokus $i. Další za $((i * 10)) s."
            sleep $((i * 10))
          done
          echo "Spojení se serverem se nepodařilo navázat."; exit 1

      - name: Zapnout režim údržby
        id: maintenance
        run: |
          ssh "$REMOTE" \
            "cd '${{ secrets.DEPLOY_PATH }}' && ${{ secrets.PHP_BIN }} artisan down --render=errors::503 --retry=15 || true"

      # Záloha databáze ještě před nahráním nového kódu. Když selže, nasazení
      # skončí se starým kódem i starou databází a krok níž web nahodí zpět.
      # Příkaz se nahraje napřed sám, ať funguje i na serveru, kde ještě není.
      - name: Zálohovat databázi
        run: |
          rsync -az -e ssh app/Console/Commands/DbBackup.php \
            "$REMOTE:${{ secrets.DEPLOY_PATH }}/app/Console/Commands/DbBackup.php"
          ssh "$REMOTE" \
            "cd '${{ secrets.DEPLOY_PATH }}' && ${{ secrets.PHP_BIN }} artisan db:zaloha"

      - name: Nahrát soubory
        run: |
          rsync -az --delete --human-readable \
            --exclude-from=.github/deploy-exclude.txt \
            -e ssh \
            ./ "$REMOTE:${{ secrets.DEPLOY_PATH }}/"

      - name: Migrace, cache a nahození webu
        run: |
          ssh "$REMOTE" bash -se <<'REMOTE_SCRIPT'
            set -euo pipefail
            cd '${{ secrets.DEPLOY_PATH }}'
            PHP='${{ secrets.PHP_BIN }}'
            WEB_USER='${{ secrets.WEB_USER }}'

            # Pojistka: ať se web VŽDY nahodí zpět, i kdyby něco spadlo uprostřed
            trap '"$PHP" artisan up || true' EXIT

            "$PHP" artisan migrate --force
            "$PHP" artisan storage:link || true

            # Zmenšeniny obrázků. Nové vznikají při uložení v administraci, tady
            # se doplní ty, které na serveru ještě nejsou (první nasazení, obsah
            # nahraný před zavedením zmenšenin). Hotové se přeskočí.
            "$PHP" artisan obrazky:zmensit || true

            "$PHP" artisan optimize
            "$PHP" artisan queue:restart

            # lsphp běží pod uživatelem webu — vrátit vlastnictví nahraných souborů.
            # Bez toho zůstane cache konfigurace rootovi a tlačítko „Obnovit cache“
            # v administraci ji nepřepíše (změna .env se pak neprojeví). Když tajemství
            # WEB_USER chybí, vezme se vlastník složky storage, tu zakládá hosting.
            if [ -z "$WEB_USER" ]; then
              WEB_USER=$(stat -c '%U' storage 2>/dev/null || true)
              [ "$WEB_USER" = "root" ] && WEB_USER=''
            fi
            if [ -n "$WEB_USER" ]; then
              chown -R "$WEB_USER:$WEB_USER" . \
                || echo "Varování: chown neprošel, zkontroluj práva ručně."
            fi
          REMOTE_SCRIPT

      # Jen když už se web stihl shodit. Spadne-li nasazení dřív (třeba
      # na SSH), web běží dál a tenhle krok by jen přidal druhou chybu.
      - name: Nahodit web zpět, když nasazení spadlo
        if: failure() && steps.maintenance.outcome != 'skipped'
        run: |
          ssh "$REMOTE" \
            "cd '${{ secrets.DEPLOY_PATH }}' && ${{ secrets.PHP_BIN }} artisan up || true"

      - name: Ověřit, že web běží
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.PRODUCTION_URL }})
            if [ "$code" = "200" ]; then echo "OK ($code)"; exit 0; fi
            echo "Pokus $i: $code"; sleep 10
          done
          echo "Web po nasazení neodpovídá 200."; exit 1

      - name: Zavřít spojení
        if: always()
        run: ssh -O exit "$REMOTE" 2>/dev/null || true
