name: Deploy

# Nasadí se až po zeleném CI a jen z větve main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Nasazení na produkci
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: production

    steps:
      - name: Nasadit přes SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            # CyberPanel/OpenLiteSpeed: PHP 8.4 je lsphp84, ne systémové php (8.3)
            PHP="${{ secrets.PHP_BIN }}"

            # Pojistka: ať se web VŽDY nahodí zpět, i kdyby deploy spadl uprostřed
            trap '$PHP artisan up || true' EXIT

            $PHP artisan down --render="errors::503" --retry=15 || true

            git fetch --all
            git reset --hard origin/main

            $PHP /usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

            npm ci
            npm run build

            $PHP artisan migrate --force
            $PHP artisan storage:link || true

            $PHP artisan optimize
            $PHP artisan queue:restart

            # lsphp běží pod uživatelem webu — vrátit vlastnictví zapisovatelných složek
            if [ -n "${{ secrets.WEB_USER }}" ]; then
              chown -R ${{ secrets.WEB_USER }}:${{ secrets.WEB_USER }} storage bootstrap/cache
            fi

      - name: Ověřit, že web běží
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.PRODUCTION_URL }})
            if [ "$code" = "200" ]; then echo "OK ($code)"; exit 0; fi
            echo "Pokus $i: $code"; sleep 10
          done
          echo "Web po nasazení neodpovídá 200."; exit 1
