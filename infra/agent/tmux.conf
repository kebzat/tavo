# Vlákna = okna tmuxu. Ctrl+b c nové vlákno, Ctrl+b n/p přepínání,
# Ctrl+b d odpojit (vlákno běží dál). Myš zapnutá kvůli posouvání.
set -g mouse on
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -g status-style "bg=#131110,fg=#f4ede1"
set -g status-left "#[bg=#db4b24,bold] #S #[default] "
set -g status-left-length 40
set -g status-right "Ctrl+b c nové vlákno · Ctrl+b d odejít "
set -g window-status-current-style "bold,fg=#db4b24"
set -g renumber-windows on
