# Spouští se z /srv/agent/docker na serveru: `docker compose up -d --build`.
# Běžně ho ovládá příkaz `agent` (viz agent.sh), ručně sem není třeba sahat.

services:
  agent:
    build: .
    image: taveo-agent
    container_name: taveo-agent
    hostname: taveo-agent
    restart: unless-stopped
    # Jen pro server: Laravel volá API, LiteSpeed sem posílá terminál z prohlížeče.
    ports:
      - "127.0.0.1:7681:7681"
    env_file:
      - /srv/agent/terminal.env
    volumes:
      - /srv/agent/domov:/home/agent
      # rslave: projekt přidaný na serveru (připojená složka webu) se v běžícím
      # kontejneru objeví hned, bez restartu, který by ukončil rozpracovaná vlákna.
      - type: bind
        source: /srv/agent/projekty
        target: /projekty
        bind:
          propagation: rslave
      - /srv/agent/snimky:/snimky
      - /srv/agent/fronta:/fronta
      - /srv/agent/projekty.tsv:/etc/taveo-agent/projekty.tsv:ro
      # Databáze serveru přes socket. Agent se přihlásí jen údaji z .env
      # připojeného webu, root databáze přes socket chce root serveru.
      - /run/mysqld:/run/mysqld:ro
    # Strop, ať agent při buildu nebo testech nepřidusí weby na stejném serveru.
    cpus: 4
    mem_limit: 8g
    pids_limit: 2048
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
